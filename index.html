<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4338ca">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="สต็อก">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
<title>สต็อกสินค้า</title>
<style>
:root{
  --bg:#f3f4fa; --surface:#fff; --surface2:#f6f7fc; --text:#161a2e; --muted:#6a7189; --line:#e6e8f2; --chip:#eceefa;
  --brand:#4f46e5; --brand2:#2563eb; --brand-ink:#fff; --danger:#e5484d; --danger-bg:#fdecec; --ok:#12a150; --warn:#c77700; --warn-bg:#fff3dc;
  --hero:linear-gradient(135deg,#4338ca 0%,#2563eb 100%);
  --shadow:0 1px 2px rgba(22,26,46,.05),0 6px 18px -6px rgba(22,26,46,.10);
  --fab-shadow:0 10px 24px -6px rgba(67,56,202,.55);
  --head:'Prompt','Noto Sans Thai',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0c0f1a; --surface:#161a2b; --surface2:#1c2135; --text:#eaedf8; --muted:#8f97b3; --line:#262c44; --chip:#212842;
  --brand:#8b93ff; --brand-ink:#0c0f1a; --danger:#ff7b80; --danger-bg:#3a1c22; --ok:#4ade80; --warn:#f5b545; --warn-bg:#3a2d14;
  --hero:linear-gradient(135deg,#2b2a78 0%,#1d3f96 100%); --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 20px -10px rgba(0,0,0,.6); --fab-shadow:0 10px 24px -6px rgba(0,0,0,.6)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:active:not(:disabled){transform:scale(.97)}
[hidden]{display:none!important}
svg{width:1em;height:1em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.num{font-family:var(--head);font-variant-numeric:tabular-nums}
#app{max-width:640px;margin:0 auto;padding-bottom:calc(176px + env(safe-area-inset-bottom))}

/* hero */
.hero{background:var(--hero);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 26px;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero::before{content:"";position:absolute;left:-40px;bottom:-90px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.hero h1{font-family:var(--head);font-size:24px;font-weight:600;margin:0;letter-spacing:-.2px}
.hero .sub{font-size:13px;opacity:.75;margin-top:2px}
.circle-btn{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.16);color:#fff;font-size:20px;display:grid;place-items:center;backdrop-filter:blur(6px)}
.stats{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:20px;position:relative;z-index:1}
.stat{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:11px 12px;backdrop-filter:blur(6px)}
.stat b{display:block;font-family:var(--head);font-size:24px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;opacity:.8}
.stat.alert b{color:#ffd9a3}

/* sticky search + filters */
.sticky{position:sticky;top:0;z-index:8;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:12px 16px 6px;padding-top:calc(12px + env(safe-area-inset-top) * 0)}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:18px;pointer-events:none}
.search input{width:100%;padding:12px 14px 12px 42px;border-radius:14px;border:1.5px solid transparent;background:var(--surface);box-shadow:var(--shadow);outline:none}
.search input:focus,.field:focus{border-color:var(--brand)}
.frow{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;padding:9px 0 2px;margin:0 -16px;padding-left:16px;padding-right:16px}
.frow::-webkit-scrollbar{display:none}
.frow .lbl{flex:none;font-size:12px;color:var(--muted);width:34px}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-size:14px;border:1.5px solid transparent;white-space:nowrap;transition:background .15s,border-color .15s}
.chip.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--surface));color:var(--brand);font-weight:600}
.chip.clear{background:transparent;box-shadow:none;color:var(--muted);text-decoration:underline}
.sw{display:inline-block;width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(128,128,128,.4);flex:none}

/* cards */
.list{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding:8px 16px 0}
.card{display:block;width:100%;min-width:0;text-align:left;background:var(--surface);border-radius:20px;padding:14px;box-shadow:var(--shadow);animation:pop .25s ease-out both}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.card-top{display:flex;gap:12px;align-items:center}
.mosaic{width:52px;height:52px;border-radius:15px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;flex:none;background:var(--chip);box-shadow:inset 0 0 0 1px rgba(128,128,128,.25);color:var(--muted);place-items:center;font-size:22px}
.mosaic.lg{width:56px;height:56px;border-radius:17px}
.mosaic i{display:block;width:100%;height:100%;box-shadow:inset 0 0 0 .5px rgba(128,128,128,.25)}
.mosaic img{grid-area:1/1/3/3;width:100%;height:100%;object-fit:cover;display:block}
.banner{display:block;width:100%;height:210px;object-fit:cover;border-radius:20px;margin-bottom:12px;box-shadow:var(--shadow);background:var(--chip)}
.photo-pick{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.ph{width:96px;height:96px;border-radius:22px;background:var(--chip);color:var(--muted);display:grid;place-items:center;font-size:32px;overflow:hidden;flex:none;box-shadow:inset 0 0 0 1.5px var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph-btns{display:grid;gap:8px;flex:1}
.ph-btns .btn{min-height:42px;padding:8px 14px;font-size:14px}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.thumb{position:relative;width:84px;height:84px;border-radius:16px;overflow:hidden;background:var(--chip);box-shadow:inset 0 0 0 1.5px var(--line);flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.thumb .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.thumb .x svg{width:14px;height:14px}
.thumb.add{display:grid;place-items:center;align-content:center;gap:2px;color:var(--muted);font-size:12px}
.thumb.add svg{width:26px;height:26px}
.o-photos{display:flex;gap:8px;overflow-x:auto;padding:8px 0;border-top:1px solid var(--line)}
.o-photos .thumb{width:72px;height:72px;border-radius:14px}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:12px}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.info{flex:1;min-width:0}
.name{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qty{text-align:right;line-height:1}
.qty b{font-family:var(--head);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
.qty small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.bar{display:flex;height:7px;border-radius:99px;overflow:hidden;background:var(--chip);margin:13px 0 10px;gap:2px}
.bar i{display:block;min-width:4px;box-shadow:inset 0 0 0 .5px rgba(128,128,128,.3)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:2px 10px 2px 7px;font-size:13px}
.pill .sw{width:12px;height:12px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--danger-bg);color:var(--danger)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.pills .badge{margin-left:auto}
.empty{text-align:center;color:var(--muted);padding:44px 24px}
.empty svg.big{width:64px;height:64px;color:var(--brand);opacity:.9;stroke-width:1.5;margin-bottom:8px}
.empty h3{font-family:var(--head);color:var(--text);margin:0 0 4px;font-size:19px}
.empty .btn{margin-top:14px}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom));display:inline-flex;align-items:center;gap:8px;padding:0 24px 0 18px;height:56px;border-radius:99px;background:var(--hero);color:#fff;font-weight:600;box-shadow:var(--fab-shadow);z-index:9;font-size:16px}
.fab:active{transform:translateX(-50%) scale(.97)!important}
.fab svg{font-size:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:14px;background:var(--brand);color:var(--brand-ink);font-weight:600;min-height:48px}
.btn.primary{background:var(--hero);color:#fff}
.btn.ghost{background:var(--chip);color:var(--text)}
.btn.danger{background:var(--danger-bg);color:var(--danger)}
.btn.block{width:100%}

/* sheets */
.layer{position:fixed;inset:0;z-index:20;background:rgba(8,10,24,.55);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.layer[hidden]{display:none}
@keyframes fade{from{opacity:0}}
.panel{background:var(--bg);width:100%;max-width:640px;max-height:93vh;max-height:93dvh;border-radius:26px 26px 0 0;display:flex;flex-direction:column;animation:up .24s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(60px);opacity:.3}}
.handle{width:38px;height:5px;border-radius:9px;background:var(--line);margin:9px auto 0;flex:none}
.panel-head{display:flex;align-items:center;gap:12px;padding:12px 16px 10px}
.panel-head .ttl{flex:1;min-width:0}
.panel-head h2{font-family:var(--head);font-weight:600;margin:0;font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:40px;height:40px;border-radius:13px;background:var(--surface);box-shadow:var(--shadow);font-size:18px;display:grid;place-items:center;flex:none}
.icon-btn.tint{background:var(--chip);color:var(--brand)}
.panel-body{overflow-y:auto;padding:4px 16px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.mini-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.mini-stats div{background:var(--surface);border-radius:14px;padding:9px 12px;box-shadow:var(--shadow)}
.mini-stats b{display:block;font-family:var(--head);font-size:20px;font-weight:600;line-height:1.15}
.mini-stats span{font-size:12px;color:var(--muted)}
.group{background:var(--surface);border-radius:20px;padding:6px 14px 8px;margin-bottom:12px;box-shadow:var(--shadow)}
.group-head{display:flex;align-items:center;gap:10px;padding:8px 0 6px}
.group-head .sw{width:26px;height:26px}
.group-head .gn{flex:1;min-width:0}
.group-head b{display:block;font-weight:600;line-height:1.2}
.group-head small{color:var(--muted);font-size:12px}
.mini{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--brand);font-weight:600;padding:7px 12px;border-radius:99px;background:color-mix(in srgb,var(--brand) 11%,transparent)}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.row.out .szb{background:var(--danger-bg);color:var(--danger)}
.szb{min-width:52px;text-align:center;font-family:var(--head);font-weight:600;font-size:15px;padding:7px 8px;border-radius:11px;background:var(--chip)}
.share{flex:1;min-width:12px;height:6px;border-radius:9px;background:var(--chip);overflow:hidden}
.share i{display:block;height:100%;border-radius:9px;background:var(--brand);opacity:.8}
.step{display:flex;align-items:center;background:var(--chip);border-radius:15px;padding:3px}
.step button{width:40px;height:40px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;font-size:18px}
.step input{width:54px;height:40px;text-align:center;background:transparent;border:0;outline:none;font-family:var(--head);font-size:18px;font-weight:600;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.step input.zero{color:var(--danger)}
.x{width:32px;height:36px;color:var(--muted);font-size:17px;display:grid;place-items:center;opacity:.7}
.field{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);outline:none}
.form label{display:block;font-size:13px;color:var(--muted);margin:16px 0 8px;font-weight:500}
.form label:first-child{margin-top:4px}
.inline{display:flex;gap:8px;margin-top:10px}
.inline .field{flex:1;min-width:0}
input[type=color]{width:50px;height:50px;padding:3px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);flex:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips .chip{padding:8px 14px}
.actions{display:grid;gap:10px;margin-top:22px}
.hint{color:var(--muted);font-size:13px;margin:14px 2px 0}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1c2033;color:#fff;padding:11px 18px;border-radius:14px;z-index:50;font-size:14px;max-width:90%;box-shadow:0 10px 24px -8px rgba(0,0,0,.5);animation:pop .2s}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav div{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;color:var(--muted);font-size:12px;font-weight:500}
.nav button svg{font-size:23px}
.nav button.on{color:var(--brand);font-weight:600}
.av{width:52px;height:52px;border-radius:50%;color:#fff;display:grid;place-items:center;font-family:var(--head);font-weight:600;font-size:20px;flex:none}
.av svg{font-size:22px}
.av.lg{width:56px;height:56px}
.last{margin-top:12px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:9px 12px;font-size:14px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.last b{font-family:var(--head);color:var(--brand);white-space:nowrap}
.last span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.order{background:var(--surface);border-radius:20px;padding:10px 14px 8px;margin-bottom:12px;box-shadow:var(--shadow)}
.o-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.o-date{font-size:13px;color:var(--muted);font-weight:500}
.kv{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--line);align-items:baseline}
.kv span{width:62px;color:var(--muted);font-size:13px;flex:none}
.kv b{font-weight:600;flex:1;min-width:0;word-break:break-word}
.kv .tension{font-family:var(--head);font-size:20px;color:var(--brand)}
.kv.note b{font-weight:400;color:var(--muted)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--chip);border-radius:14px;padding:3px;margin-top:10px}
.seg button{padding:9px;border-radius:11px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--brand);box-shadow:var(--shadow);font-weight:600}
.hintcard{margin-top:10px;background:color-mix(in srgb,var(--brand) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--brand) 30%,transparent);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:14px}
.hintcard small{color:var(--muted)}
a.icon-btn{color:var(--brand);text-decoration:none}
.spark{width:100%;height:64px;stroke:none;fill:none;display:block}
.sec{font-family:var(--head);font-weight:600;font-size:15px;margin:16px 2px 8px}
.numc{min-width:34px;text-align:right;font-family:var(--head);font-weight:600}
.pkr{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px}
.pkr input{width:20px;height:20px;accent-color:var(--brand);flex:none}
.banner-i{background:color-mix(in srgb,var(--brand) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--brand) 28%,transparent);border-radius:16px;padding:14px;font-size:14px;margin-bottom:4px}
.banner-i .btn{margin-top:10px;min-height:42px;padding:8px 16px;font-size:14px}
.nb{position:absolute;top:3px;left:calc(50% + 6px);background:var(--danger);color:#fff;border-radius:99px;font-size:11px;font-weight:600;min-width:18px;height:18px;line-height:18px;padding:0 5px;text-align:center}
.badge.mut{background:var(--chip);color:var(--muted)}
.qcard{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;animation:pop .25s ease-out both}
.qcard.urg{box-shadow:inset 5px 0 0 var(--warn),var(--shadow)}
.qcard.late{box-shadow:inset 5px 0 0 var(--danger),var(--shadow)}
.q-main{display:flex;gap:12px;align-items:flex-start;padding:14px 14px 8px;cursor:pointer}
.qn{width:40px;height:40px;border-radius:13px;background:var(--hero);color:#fff;font-family:var(--head);font-weight:600;font-size:18px;display:grid;place-items:center;flex:none}
.qcard.done .qn{background:var(--chip);color:var(--ok)}
.q-info{flex:1;min-width:0}
.q-info .tags{margin-top:8px}
.q-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 14px 14px}
.q-foot .sp{flex:1}
.star-btn{display:inline-flex;align-items:center;gap:5px;padding:8px 12px;border-radius:12px;background:var(--chip);color:var(--muted);font-weight:600;font-size:14px}
.star-btn.on{background:var(--warn-bg);color:var(--warn)}
.star-btn.on svg{fill:currentColor}
.done-btn{background:var(--ok);color:#fff;font-weight:600;padding:10px 16px;border-radius:14px;display:inline-flex;align-items:center;gap:6px;font-size:15px}
.undo-btn{background:var(--chip);color:var(--muted);font-weight:600;padding:8px 14px;border-radius:12px;font-size:14px}
.orow{display:block;width:100%;text-align:left;background:var(--surface);border-radius:16px;padding:11px 14px;box-shadow:var(--shadow)}
/* long lists: cards off screen are not laid out until scrolled near (big saving on phones) */
#list>.card,#list>.orow{content-visibility:auto;contain-intrinsic-size:auto 150px}
.or-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.or-n{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.or-t{font-family:var(--head);color:var(--brand);font-weight:600;white-space:nowrap}
.orow .meta{white-space:normal;margin-top:2px}
.orow .tags{margin-top:8px}
.dh{display:flex;justify-content:space-between;align-items:baseline;padding:8px 4px 0;font-weight:600;font-size:14px}
.dh span{color:var(--muted);font-weight:400;font-size:13px}
.datef{flex:1;min-width:0;padding:8px 10px}
.opts{display:grid;gap:8px;margin-top:8px}
.opt2 .lb span{opacity:.45}
.opt2 .lb .act{opacity:1;font-weight:600}
.opt2 .lb i{font-style:normal;opacity:.4;margin:0 4px}
.opt2{display:flex;align-items:center;gap:10px;padding:12px 12px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);font-weight:500;text-align:left;min-width:0}

const ui = { tab: 'stock', src: db.products.some(p => p.pk) ? 'pos' : 'own', cat: null, gone: false, q: '', cq: '', color: null, size: null, open: null, cust: null, sview: 'list', sper: 'last', sfilter: 'all', sdet: null, cview: 'cust', qview: 'wait', qsort: 'due', per: 'all', by: 'drop', from: '', to: '', shown: [] };

/* ---------- product photos (IndexedDB, keyed by product id) ---------- */
const imgs = new Map(); // product id -> object URL
let dbp;
const openDB = () => dbp ||= new Promise((res, rej) => {
  const r = indexedDB.open('stock-img', 1);

async function setImage(id, blob) {

  const cur = [...(of.id ? orderPhotoKeys(of.id).filter(k => !opend.rm.has(k)).map(k => [k, imgs.get(k)]) : []), ...opend.add.map(a => [a.k, a.url])];

// Thai numbers: +66 81 234 5678 / 0066812345678 / 081-234-5678 all become 0812345678
function normPhone(s) {

  if (d.startsWith('0066')) { d = d.slice(4); intl = true; }
  else if (d.startsWith('66') && d.length >= 10) { d = d.slice(2); intl = true; }
  if (intl && !d.startsWith('0')) d = '0' + d;

}
// Makes any loaded / restored data structurally safe so one bad record can never break the whole app
function normalizeDb(d) {

  const seen = new Set(), idOk = x => typeof x === 'string' && /^[\w-]{1,40}$/.test(x);

  const str = v => String(v ?? ''), n0 = v => { const n = Number(v); return isFinite(n) ? n : 0; };
  const isDay = v => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v);
  const products = (Array.isArray(d.products) ? d.products : []).filter(p => p && typeof p === 'object').map(p => ({
    ...p, id: uniqId(p.id), name: str(p.name), sku: str(p.sku), category: str(p.category), unit: str(p.unit), pk: p.pk ? str(p.pk) : undefined,
    variants: (Array.isArray(p.variants) ? p.variants : []).filter(v => v && typeof v === 'object').map(v => ({

      hex: /^#[0-9a-f]{3,8}$/i.test(v.hex) ? v.hex : '#c7cad6', vk: v.vk ? str(v.vk) : undefined, gone: v.gone ? true : undefined }))
  }));
  const orders = (Array.isArray(d.orders) ? d.orders : []).filter(o => o && typeof o === 'object').map(o => ({
    ...o, id: uniqId(o.id), phone: normPhone(o.phone), name: str(o.name), racket: str(o.racket), string: str(o.string), t: str(o.t), t2: str(o.t2), note: str(o.note),
    unit: o.unit === 'kg' ? 'kg' : 'lbs', date: isDay(o.date) ? o.date : new Date().toISOString().slice(0, 10), pickup: isDay(o.pickup) ? o.pickup : '',
    status: o.status === 'wait' || o.status === 'done' || o.status === 'picked' ? o.status : '', doneAt: str(o.doneAt), pickedAt: str(o.pickedAt), urgent: !!o.urgent, paid: !!o.paid, free: Math.max(0, n0(o.free)),
    skip: o.skip === 'skip' ? 'skip' : str(o.skip), knot: str(o.knot), pre: str(o.pre), u: str(o.u),
    fb: typeof o.fb === 'string' && o.fb ? o.fb : undefined,
    fu: o.fu && typeof o.fu === 'object' ? Object.fromEntries(Object.entries(o.fu).filter(([k, v]) => OFIELDS.includes(k) && typeof v === 'string')) : undefined }));

  const isoMap = m => { const out = {}; if (m && typeof m === 'object') Object.entries(m).forEach(([k, v]) => { if (typeof v === 'string') out[k] = v; }); return out; };
  const tomb = isoMap(d.tomb), adjAt = {};
  Object.entries(isoMap(d.adjAt)).forEach(([k, v]) => { const ph = normPhone(k); if (!adjAt[ph] || v > adjAt[ph]) adjAt[ph] = v; });

  const settings = { ...st, goal: Math.min(50, Math.max(1, parseInt(st.goal) || 10)) };

function load() {

const stale = () => { const r = readRev(); return r !== undefined && r !== myRev; };

  clearTimeout(syncTimer); syncTimer = setTimeout(syncFromStorage, 0);
  return false;

// The sales snapshots are a large part of the data but change only on a POS import, so their JSON is reused between saves.
// Anything that changes db.snaps in place must bump snapsVer (a new array, a new length or a new last snapshot is noticed anyway).
let snapsVer = 0, snapsCache = null;
function dbJson() {
  const S = db.snaps, last = S[S.length - 1], key = `${S.length}|${last ? last.t : ''}|${snapsVer}`;
  if (!snapsCache || snapsCache.arr !== S || snapsCache.key !== key) snapsCache = { arr: S, key, json: JSON.stringify(S) };

function spark(series) {
  const W = 300, H = 64, max = Math.max(1, ...series), n = series.length;
  const pts = series.map((v, i) => `${(n === 1 ? W / 2 : i / (n - 1) * W).toFixed(1)},${(H - 6 - v / max * (H - 14)).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polygon points="0,${H} ${pts} ${W},${H}" fill="color-mix(in srgb,var(--brand) 16%,transparent)"/><polyline points="${pts}" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}

/* ---------- POS import (pure logic) ---------- */
const COLOR_TH = { WHITE: 'ขาว', WH: 'ขาว', BLACK: 'ดำ', BK: 'ดำ', BLUE: 'น้ำเงิน', BLU: 'น้ำเงิน', BL: 'น้ำเงิน', PINK: 'ชมพู', GREEN: 'เขียว', GR: 'เทา', PURPLE: 'ม่วง', PUL: 'ม่วง', RED: 'แดง', YELLOW: 'เหลือง', YEL: 'เหลือง', ORANGE: 'ส้ม', ORA: 'ส้ม', NAVY: 'กรมท่า', GOLD: 'ทอง', BROWN: 'น้ำตาล', CREAM: 'ครีม', SILVER: 'เงิน', GRAY: 'เทา', GREY: 'เทา', NEON: 'นีออน', ROSE: 'โรส', SKY: 'ฟ้า' };
const COLOR_HEX = { ขาว: '#f5f5f5', ดำ: '#1f1f1f', น้ำเงิน: '#1e40af', ชมพู: '#f48fb1', เขียว: '#43a047', เทา: '#9e9e9e', ม่วง: '#8e24aa', แดง: '#e53935', เหลือง: '#fdd835', ส้ม: '#fb8c00', กรมท่า: '#1e3a8a', ทอง: '#d4af37', น้ำตาล: '#795548', ครีม: '#f3e5c8', เงิน: '#c0c0c0', นีออน: '#b6f23a', โรส: '#e91e63', ฟ้า: '#29b6f6' };
const COLOR_IGNORE = new Set(['NEW', 'ORI', 'COLOUR', 'COLOR']);
const SIZE_RE = /^(?:XS|2XS|S|M|L|[2-5]?XL|FREE|EUR\d+(?:\.\d)?|IBS\d+|\d[UF](?:\s?G\d)?(?:\/.*)?)$/i;
const BRAND_TAGS = new Set(['VS', 'VICTOR', 'LI-NING', 'YONEX', 'ADIDAS']); // brand words used as a variant label carry no size/colour
const NOISE_TOKENS = new Set(['MIXED', 'PC']);
const UNIT_TH = { PC: 'ชิ้น', PAIR: 'คู่', PACK: 'แพ็ค', SET: 'ชุด', BOX: 'กล่อง' };

// "a & b" style colour token -> { name: 'แดง/ขาว', hex } or null when the token is not a colour
function colorOf(token) {
  const parts = token.toUpperCase().split(/[&\s/]+/).filter(x => x && !COLOR_IGNORE.has(x));
  if (!parts.length || !parts.every(x => COLOR_TH[x])) return null;
  const th = parts.map(x => COLOR_TH[x]);
  return { name: [...new Set(th)].join('/'), hex: COLOR_HEX[th[0]] || '#9aa0b4' };
}
const num = v => { const n = Number(String(v ?? '').replace(/[,฿\s]/g, '')); return isNaN(n) ? 0 : n; };

// One POS row -> { pk, name, category, unit, color, hex, size, qty }
function parsePosRow(name, category, unit, stock) {
  name = String(name ?? '').trim();
  const cut = name.lastIndexOf(' - ');
  const base = cut >= 0 ? name.slice(0, cut) : name, variant = cut >= 0 ? name.slice(cut + 3).trim() : '';
  let tokens = base.split('_').map(t => t.trim()).filter(Boolean);

  let color = null, ci = tokens.findIndex((t, i) => i > 0 && colorOf(t));
  if (ci >= 0) { color = colorOf(tokens[ci]); tokens.splice(ci, 1); }

  let size = '', extra = '';
  if (variant && !BRAND_TAGS.has(variant.toUpperCase())) { if (SIZE_RE.test(variant)) size = variant.toUpperCase(); else extra = variant; }
  const si = tokens.findIndex(t => /^EUR\d+(\.\d)?$/i.test(t));
  if (si >= 0 && !size) { size = tokens[si].toUpperCase(); tokens.splice(si, 1); }
  tokens = tokens.filter(t => !NOISE_TOKENS.has(t.toUpperCase()));

  let label = color ? color.name : '', hex = color ? color.hex : '#c7cad6';
  if (extra) { label = label ? `${label} · ${extra}` : extra; if (!color) hex = '#9aa0b4'; }
  const qty = num(stock);
  return { pk: `${category}|${tokens.join('_')}`, name: tokens.join(' ') || name, category: String(category ?? '').trim(), unit: UNIT_TH[String(unit).toUpperCase()] || '', color: label || 'ไม่ระบุ', hex, size: size || 'Free', qty: Math.max(0, qty), neg: qty < 0 };
}

// sheet rows (array of arrays, first row = header) -> Map(pk -> product group) + stats
function planPosImport(aoa) {
  const head = (aoa[0] || []).map(h => String(h ?? '').trim());
  const col = names => head.findIndex(h => names.some(n => h.includes(n)));
  const c = { name: col(['ชื่อสินค้า']), cat: col(['หมวดหมู่']), unit: col(['หน่วย']), stock: col(['สต๊อก', 'สต็อก']) };
  if (c.name < 0 || c.stock < 0) return { error: 'ไม่พบคอลัมน์ "ชื่อสินค้า" และ "สต๊อกสินค้า" ในไฟล์นี้' };
  const groups = new Map(); let rows = 0, neg = 0, skipped = 0;
  for (const r of aoa.slice(1)) {
    if (!r || !String(r[c.name] ?? '').trim()) continue;
    const p = parsePosRow(r[c.name], c.cat >= 0 ? r[c.cat] : '', c.unit >= 0 ? r[c.unit] : '', r[c.stock]);
    if (p.qty >= 1e5) { skipped++; continue; } // services carry a placeholder stock like 99999933 / 999969
    rows++; if (p.neg) neg++;
    let g = groups.get(p.pk); if (!g) groups.set(p.pk, g = { pk: p.pk, name: p.name, category: p.category, unit: p.unit, variants: new Map() });
    const vk = `${p.color}|${p.size}`, v = g.variants.get(vk);
    if (v) v.qty += p.qty; else g.variants.set(vk, { vk, color: p.color, hex: p.hex, size: p.size, qty: p.qty });
  }
  return { groups, rows, neg, skipped };
}

function loadXLSX() {

    const sc = document.createElement('script'); sc.src = 'xlsx.mini.min.js'; sc.onload = res; sc.onerror = () => rej(new Error('lib'));
    document.head.append(sc);

// Which existing product each file group belongs to. Exact pk first; then a product whose only change in POS is its category
// (same name part, exactly one candidate on each side). Renamed products are NOT guessed - they show up as new + missing.
const pkTail = pk => pk.slice(pk.indexOf('|') + 1);
function matchPos(plan) {
  const m = new Map(), used = new Set(), byPk = new Map(db.products.filter(p => p.pk).map(p => [p.pk, p]));
  plan.groups.forEach(g => { const p = byPk.get(g.pk); if (p) { m.set(g.pk, p); used.add(p); } });
  const add = (map, k, v) => { const l = map.get(k); if (l) l.push(v); else map.set(k, [v]); }, freeP = new Map(), freeG = new Map();
  db.products.forEach(p => { if (p.pk && !used.has(p)) add(freeP, pkTail(p.pk), p); });
  plan.groups.forEach(g => { if (!m.has(g.pk)) add(freeG, pkTail(g.pk), g); });
  freeG.forEach((gs, t) => { const ps = freeP.get(t); if (gs.length === 1 && ps && ps.length === 1) m.set(gs[0].pk, ps[0]); });
  const mine = new Map(); m.forEach((p, gpk) => mine.set(p, plan.groups.get(gpk)));
  return { m, mine };
}
// compare a plan with what is already in the app (no changes made)
function diffPos(plan) {
  const { m, mine } = matchPos(plan);
  const d = { newP: 0, newV: 0, upd: 0, same: 0, missing: 0, existing: 0, moved: 0, lost: [] };
  plan.groups.forEach(g => {
    const p = m.get(g.pk);
    if (!p) { d.newP++; d.newV += g.variants.size; return; }
    if (p.pk !== g.pk) d.moved++;
    g.variants.forEach(v => { const x = p.variants.find(y => y.vk === v.vk); if (!x) d.newV++; else if (x.qty !== v.qty) d.upd++; else d.same++; });
  });
  db.products.forEach(p => {
    if (!p.pk) return;
    const g = mine.get(p); let n = 0;
    p.variants.forEach(x => { if (!x.vk) return; d.existing++; n++; if (!(g && g.variants.has(x.vk))) d.missing++; });
    if (!g && n) d.lost.push(p.name);
  });
  return d;
}
// mode for rows that exist in the app but not in the file: keep (flag them) | zero | delete
function applyPos(plan, mode = 'keep') {
  const { m, mine } = matchPos(plan);
  plan.groups.forEach(g => {
    let p = m.get(g.pk);
    if (!p) { p = { id: uid(), name: g.name, sku: '', category: g.category, unit: g.unit, pk: g.pk, variants: [] }; db.products.push(p); mine.set(p, g); }
    else {
      if (p.pk !== g.pk) { // category changed in POS: follow it, and re-key the sales history so it stays attached
        const oldKeys = p.variants.filter(x => x.vk).map(x => [x, snapKey(p, x)]), oldCat = p.pk.slice(0, p.pk.indexOf('|'));
        p.pk = g.pk; if (!p.category || p.category === oldCat) p.category = g.category;
        oldKeys.forEach(([x, ok]) => { const nk = snapKey(p, x); db.snaps.forEach(s => { if (ok in s.q) { s.q[nk] = s.q[ok]; delete s.q[ok]; } }); }); snapsVer++;
      }
      if (!p.category) p.category = g.category; if (!p.unit) p.unit = g.unit;
    }
    g.variants.forEach(v => {
      const x = p.variants.find(y => y.vk === v.vk);
      if (x) { x.qty = v.qty; delete x.gone; } else p.variants.push({ id: uid(), color: v.color, hex: v.hex, size: v.size, qty: v.qty, vk: v.vk });
    });
  });
  const emptied = [];
  db.products.forEach(p => {
    if (!p.pk) return;
    const g = mine.get(p);
    p.variants = p.variants.filter(x => {
      if (!x.vk || (g && g.variants.has(x.vk))) return true; // hand-added variants and rows present in the file stay
      if (mode === 'delete') return false;
      x.gone = true; if (mode === 'zero') x.qty = 0; return true;
    });
    if (!p.variants.length) emptied.push(p);
  });
  if (emptied.length) db.products = db.products.filter(x => !emptied.includes(x)); // their photos stay while the safety copy needs them
  return save();
}

      <label class="pkr"><input type="radio" name="posmiss" value="zero"> ตั้งจำนวนเป็น 0</label>

/* ---------- customers & orders ---------- */
const digits = s => String(s ?? '').replace(/\D/g, '');
const fmtPhone = d => d.length === 10 ? `${d.slice(0, 3)}-${d.slice(3, 6)}-${d.slice(6)}` : d.length === 9 ? `${d.slice(0, 2)}-${d.slice(2, 5)}-${d.slice(5)}` : d;
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const today = () => ymd(new Date());
const fmtDate = s => { const d = new Date(s + 'T00:00:00'); return isNaN(d) ? '' : d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' }); };
const tensionText = o => o.t ? `${o.t}${o.t2 ? '/' + o.t2 : ''} ${o.unit === 'kg' ? 'kg' : 'lbs'}` : '';
const orderLine = o => [o.racket, o.string && 'เอ็น ' + o.string].filter(Boolean).join(' · ');
const optList = o => [o.skip === 'skip' && 'เว้นโปร', o.knot === '4' && '4 ปม', o.pre && 'Pre ' + o.pre + '%'].filter(Boolean);
const tagsHtml = o => optList(o).map(l => `<span class="tag">${esc(l)}</span>`).join('');
const hue = d => (parseInt(d.slice(-4) || '0', 10) * 47) % 360;

function customers() {
  const m = new Map();
  db.orders.forEach(o => { const c = m.get(o.phone) || { phone: o.phone, orders: [] }; c.orders.push(o); m.set(o.phone, c); });
  return [...m.values()].map(c => {
    c.orders.sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.id.localeCompare(a.id));
    c.last = c.orders[0]; c.name = (c.orders.find(o => o.name) || {}).name || ''; return c;
  }).sort((a, b) => (b.last.date || '').localeCompare(a.last.date || ''));
}
const avatarC = (c, lg) => `<div class="av ${lg ? 'lg' : ''}" style="background:hsl(${hue(c.phone)} 52% 46%)">${c.name ? esc([...c.name][0]) : icon('phone')}</div>`;

const goal = () => Math.max(1, parseInt(db.settings && db.settings.goal) || 10);
// points: 1 per stringing order (has tension, not a free redemption); free orders spend the goal that was set at the time
function pts(c, excludeId) {
  const os = c.orders.filter(o => o.id !== excludeId);
  const earned = os.filter(o => o.t && !o.free).length, spent = os.reduce((n, o) => n + (Number(o.free) || 0), 0);
  const adj = (db.adj && db.adj[c.phone]) || 0;
  const bal = Math.max(0, earned + adj - spent), g = goal();
  return { earned, adj, spent, bal, g, ready: bal >= g, freeUsed: os.filter(o => o.free).length, stringings: os.filter(o => o.t).length };
}
function stampCard(c) {
  const P = pts(c), filled = Math.min(P.bal, P.g);
  const dots = Array.from({ length: P.g }, (_, i) => `<div class="dot ${i < filled ? 'on' : ''}">${icon('star')}</div>`).join('');
  const msg = P.ready
    ? `<b>ครบแล้ว! ขึ้นเอ็นฟรีได้</b>${P.bal >= P.g * 2 ? `<small>มี ${P.bal} แต้ม (แลกได้ ${Math.floor(P.bal / P.g)} ครั้ง)</small>` : ''}`
    : `อีก <b>${P.g - P.bal}</b> ครั้ง ขึ้นเอ็นฟรี 1 ครั้ง`;
  return `<div class="stamp"><div class="st-head"><b>บัตรสะสมแต้ม</b><span class="st-count"><b class="num">${filled}</b>/${P.g}</span></div>
    <div class="dots">${dots}</div>
    <div class="st-foot"><div class="msg">${msg}<small>ขึ้นเอ็นแล้ว ${P.stringings} ครั้ง · ใช้สิทธิ์ฟรี ${P.freeUsed} ครั้ง</small></div>
      ${P.ready ? `<button class="st-btn" data-act="redeem" data-phone="${c.phone}">ใช้สิทธิ์ฟรี</button>` : `<div class="st-adj"><button data-act="adj" data-d="-1" aria-label="ลดแต้ม">${icon('minus')}</button><button data-act="adj" data-d="1" aria-label="เพิ่มแต้ม">${icon('plus')}</button></div>`}</div></div>`;
}

const fmtDay = s => { const d = new Date(s + 'T00:00:00'); return isNaN(d) ? 'ไม่ระบุ' : d.toLocaleDateString('th-TH', { weekday: 'short', day: 'numeric', month: 'short', year: '2-digit' }); };

// ---- all-orders overview ----
function periodOk(key) {
  if (ui.per === 'all') return true;
  if (!key) return false;
  const t = today(), d = new Date();
  if (ui.per === 'today') return key === t;
  if (ui.per === '7d') {
    if (ui.by === 'pick') { d.setDate(d.getDate() + 6); return key >= t && key <= ymd(d); } // upcoming pickups
    d.setDate(d.getDate() - 6); return key >= ymd(d) && key <= t;
  }
  if (ui.per === 'month') return key.startsWith(t.slice(0, 7));
  return (!ui.from || key >= ui.from) && (!ui.to || key <= ui.to);
}

// ---- CSV export ----
const csvCell = v => { let t = String(v ?? ''); if (/^[=+\-@\t]/.test(t) && isNaN(Number(t))) t = "'" + t; return /[",\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; }; // leading = + - @ would be run as a formula by Excel
const csvPhone = p => p ? `="${p}"` : ''; // keeps the leading 0 in Excel / Sheets
async function downloadCSV(name, head, rows) {
  const text = '\uFEFF' + [head.map(csvCell).join(','), ...rows.map(r => r.join(','))].join('\r\n');
  return saveFile(`${name}-${today()}.csv`, new Blob([text], { type: 'text/csv;charset=utf-8' }));
}

function updatePts() {

/* ---------- stringing queue ---------- */
const dayDiff = s => Math.round((new Date(s + 'T00:00:00') - new Date(today() + 'T00:00:00')) / 864e5);
const fmtDT = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString('th-TH', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); };
const localDT = iso => { const d = new Date(iso); return isNaN(d) ? '' : `${ymd(d)} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
function dueTag(o) {
  if (!o.pickup) return { t: 'ไม่ระบุวันรับ', c: 'mut' };
  const d = dayDiff(o.pickup);
  return d < 0 ? { t: `เลยกำหนด ${-d} วัน`, c: '' } : d === 0 ? { t: 'รับวันนี้', c: 'warn' } : d === 1 ? { t: 'รับพรุ่งนี้', c: 'warn' } : { t: `รับอีก ${d} วัน (${fmtDate(o.pickup)})`, c: 'pt' };
}
// order of work: urgent first, then soonest pickup date (or first come first served), then deposit date
function queueSort(a, b) {
  const u = (b.urgent ? 1 : 0) - (a.urgent ? 1 : 0); if (u) return u;
  if (ui.qsort === 'due') { const pa = a.pickup || '9999', pb = b.pickup || '9999'; if (pa !== pb) return pa.localeCompare(pb); }
  return (a.date || '').localeCompare(b.date || '') || a.id.localeCompare(b.id);
}
function renderQueue() {
  $('#title').textContent = 'คิวขึ้นเอ็น';
  $('#sub').textContent = ui.qview === 'wait' ? (ui.qsort === 'due' ? 'เรียงตามวันนัดรับ งานด่วนขึ้นก่อน' : 'เรียงตามลำดับที่ฝาก งานด่วนขึ้นก่อน') : ui.qview === 'done' ? 'ขึ้นเอ็นเสร็จแล้ว รอลูกค้ามารับ' : 'ลูกค้ารับไม้ไปแล้ว';
  const names = new Map(customers().map(c => [c.phone, c.name]));
  const wait = db.orders.filter(o => o.status === 'wait'), done = db.orders.filter(o => o.status === 'done'), picked = db.orders.filter(o => o.status === 'picked');
  const todayStr = today();
  $('#summary').innerHTML =
    `<div class="stat"><b>${wait.length}</b><span>รอทำ</span></div>` +
    `<div class="stat ${wait.some(o => o.urgent || (o.pickup && o.pickup <= todayStr)) ? 'alert' : ''}"><b>${wait.filter(o => o.urgent || (o.pickup && o.pickup <= todayStr)).length}</b><span>ต้องรีบทำ</span></div>` +
    `<div class="stat"><b>${done.length}</b><span>รอลูกค้ารับ</span></div>`;
  const chip = (act, v, cur, label) => `<button class="chip ${cur === v ? 'on' : ''}" data-act="${act}" data-v="${v}">${label}</button>`;
  const pickAll = ui.qview === 'done' && done.length > 1 ? `<div class="frow"><button class="chip" data-act="pickall">ทำเครื่องหมายว่ารับแล้วทั้งหมด (${done.length})</button></div>` : '';
  $('#filters').innerHTML = `<div class="seg"><button class="${ui.qview === 'wait' ? 'on' : ''}" data-act="qview" data-v="wait">รอทำ (${wait.length})</button><button class="${ui.qview === 'done' ? 'on' : ''}" data-act="qview" data-v="done">รอรับ (${done.length})</button><button class="${ui.qview === 'picked' ? 'on' : ''}" data-act="qview" data-v="picked">รับแล้ว (${picked.length})</button></div>` +
    (ui.qview === 'wait' ? `<div class="frow"><span class="lbl">เรียง</span>${chip('qsort', 'due', ui.qsort, 'ตามวันนัดรับ')}${chip('qsort', 'fifo', ui.qsort, 'ตามลำดับที่ฝาก')}</div>` : pickAll);

  const qraw = ui.cq.trim(), q = qraw.toLowerCase(), qd = digits(qraw), numeric = /^[\d\s-]+$/.test(qraw);
  const match = o => !q || (numeric ? o.phone.includes(qd) : ((names.get(o.phone) || '') + ' ' + o.racket + ' ' + o.string).toLowerCase().includes(q));
  const src = ui.qview === 'wait' ? wait : ui.qview === 'done' ? done : picked;
  const list = (ui.qview === 'wait' ? src.slice().sort(queueSort) : src.slice().sort((a, b) => (ui.qview === 'picked' ? (b.pickedAt || '').localeCompare(a.pickedAt || '') : 0) || (b.doneAt || '').localeCompare(a.doneAt || ''))).filter(match);

  if (!list.length) {
    const none = !src.length;
    $('#list').innerHTML = `<div class="empty"><svg class="big"><use href="#i-list"/></svg><h3>${none ? (ui.qview === 'wait' ? 'ไม่มีคิวค้างอยู่' : ui.qview === 'done' ? 'ไม่มีไม้ที่รอลูกค้ามารับ' : 'ยังไม่มีงานที่ลูกค้ารับแล้ว') : 'ไม่พบงาน'}</h3>${none && ui.qview === 'wait' ? 'เพิ่มออเดอร์ที่มีค่าเอ็น งานจะเข้าคิวที่นี่อัตโนมัติ<br><button class="btn ghost" data-act="democ">ลองใช้ข้อมูลตัวอย่าง</button>' : ''}</div>`;
    return;
  }
  const lim = pageLimit();
  $('#list').innerHTML = list.slice(0, lim).map((o, i) => {
    const nm = names.get(o.phone) || fmtPhone(o.phone), due = dueTag(o), late = ui.qview === 'wait' && o.pickup && dayDiff(o.pickup) < 0;
    return `<div class="qcard ${ui.qview !== 'wait' ? 'done' : late ? 'late' : o.urgent ? 'urg' : ''}" style="animation-delay:${Math.min(i, 8) * 30}ms">
      <div class="q-main" data-act="cust" data-phone="${o.phone}">
        <div class="qn">${ui.qview !== 'wait' ? icon('check') : i + 1}</div>
        <div class="q-info"><div class="or-top"><span class="or-n">${esc(nm)}</span>${tensionText(o) ? `<span class="or-t">${esc(tensionText(o))}</span>` : ''}</div>
          <div class="meta" style="white-space:normal">${names.get(o.phone) ? esc(fmtPhone(o.phone)) + ' · ' : ''}${esc(orderLine(o)) || '—'}</div>
          ${optList(o).length || o.note ? `<div class="tags">${tagsHtml(o)}${o.note ? `<span class="tag">${esc(o.note)}</span>` : ''}</div>` : ''}</div></div>
      <div class="q-foot">${ui.qview === 'wait'
        ? `<span class="badge ${due.c}">${esc(due.t)}</span>${o.urgent ? '<span class="badge warn">ด่วน</span>' : ''}${payBtn(o)}<span class="sp"></span>
           <button class="star-btn ${o.urgent ? 'on' : ''}" data-act="urg" data-id="${o.id}">${icon('star')}ด่วน</button>
           <button class="done-btn" data-act="done" data-id="${o.id}">${icon('check')}ขึ้นเอ็นเสร็จแล้ว</button>`
        : ui.qview === 'done'
        ? `<span class="badge ok">เสร็จ ${esc(fmtDT(o.doneAt))}</span>${payBtn(o)}<span class="sp"></span><button class="undo-btn" data-act="undo" data-id="${o.id}">ย้อนกลับ</button><button class="done-btn" data-act="pick" data-id="${o.id}">${icon('check')}ลูกค้ารับไม้แล้ว</button>`
        : `<span class="badge ok">รับ ${esc(fmtDT(o.pickedAt))}</span>${payBtn(o)}<span class="sp"></span><button class="undo-btn" data-act="unpick" data-id="${o.id}">ย้อนกลับเป็นรอรับ</button>`}</div>
    </div>`;
  }).join('') + moreBtn(list.length - lim);
}

const statusBadge = o => o.status === 'wait' ? '<span class="badge warn">รอทำ</span>' : o.status === 'done' ? '<span class="badge ok">เสร็จแล้ว</span>' : o.status === 'picked' ? '<span class="badge ok">รับแล้ว</span>' : '';
const payBtn = o => `<button class="badge paybtn ${o.paid ? 'ok' : 'warn'}" data-act="pay" data-id="${o.id}">${o.paid ? 'จ่ายแล้ว' : 'ยังไม่จ่าย'}</button>`;
function setJobStatus(id, status) {
  const o = db.orders.find(x => x.id === id); if (!o) return;
  editOrder(o, x => {
    const now = new Date().toISOString(), was = x.status;
    x.status = status;
    x.doneAt = status === 'wait' ? '' : was === 'wait' || !x.doneAt ? now : x.doneAt; // finished time survives picked <-> done
    x.pickedAt = status === 'picked' ? now : '';
  });
  save(); render(); if (!$('#l1').hidden && ui.cust) renderCustDetail();
}

function demoOrders() {

/* ---------- hand-off of customers + queue between two phones ---------- */
function nowIso() { return new Date().toISOString(); }
// Each order remembers when each of its fields was last changed, so a merge takes every field from the phone that changed it last:
// one phone marking "done" and the other marking "paid" on the same order keeps both. Kept small (storage is limited):
// o.fb = time of all fields not listed in o.fu, o.fu = { field: time } for fields edited after that. Orders without them
// (new, or saved before this existed) count every field as changed at o.u. status carries doneAt and pickedAt with it.
const fVal = (o, f) => f === 'status' ? `${o.status}|${o.doneAt}|${o.pickedAt}` : String(o[f] ?? '');
const fTime = (o, f) => (o.fu && o.fu[f]) || o.fb || o.u || '';
function packTimes(o, times) { // times = { field: time } for every field
  const fb = OFIELDS.reduce((a, f) => times[f] < a ? times[f] : a, times[OFIELDS[0]]), fu = {};
  OFIELDS.forEach(f => { if (times[f] !== fb) fu[f] = times[f]; });
  if (fb === o.u && !Object.keys(fu).length) o.fb = o.fu = undefined; else { o.fb = fb; o.fu = fu; } // undefined (not delete): Object.assign onto the stored order must clear old values
}
// after = the order as it is now saved, before = its previous state (null for a new order)
function stampOrder(after, before, now) {
  after.u = now;
  if (!before) { after.fb = after.fu = undefined; return; }
  const times = {}; OFIELDS.forEach(f => { times[f] = fVal(before, f) === fVal(after, f) ? fTime(before, f) : now; });

  OFIELDS.forEach(f => {
    const tl = fTime(l, f), to = fTime(o, f), diff = fVal(l, f) !== fVal(o, f);
    if (diff && to > tl) { m[f] = o[f]; if (f === 'status') { m.doneAt = o.doneAt; m.pickedAt = o.pickedAt; } theirs = true; } else if (diff) mine = true;

  const inc = normalizeDb({ orders: [...best.values()], tomb: d.tomb, adj: d.adj, adjAt: d.adjAt }).db;
  const tomb = { ...db.tomb }; Object.entries(inc.tomb).forEach(([id, t]) => { if (!tomb[id] || t > tomb[id]) tomb[id] = t; });
  const local = new Map(db.orders.map(o => [o.id, o]));
  const soon = new Date(Date.now() + 10 * 60e3).toISOString();
  const plan = { add: [], upd: [], del: [], same: 0, both: 0, skipped: 0, tomb, adj: {}, adjAt: {}, badIds: d.orders.length - best.size, future: inc.orders.filter(o => o.u > soon).length, conflicts: [] };
  inc.orders.forEach(o => {

    if (!l) { plan.add.push(o); return; }

      if (!saved) { revertTo(before); return; } // save() already told the user; keep the form (and its photos) open so nothing is lost - a retry saves it again
      if (movePts) toast(`ย้ายแต้มที่ปรับเอง ${movePts > 0 ? '+' : ''}${movePts} ไปเบอร์ใหม่แล้ว`, 3500);
      const { add: addPh, rm: rmPh } = opend; opend = { add: [], rm: new Set() };
      let phFail = 0;
      for (const k of rmPh) await removeImage(k);
      for (const a of addPh) { try { await setImage(`o:${oid}:${a.k}`, a.blob); } catch { phFail++; } URL.revokeObjectURL(a.url); }
      if (phFail) toast(`บันทึกรูปไม่สำเร็จ ${phFail} รูป`, 3500);
      ui.cust = phone; closeLayer(2); render();
      if (a === 'saveo2') {
        const n = db.orders.filter(x => x.phone === phone && x.date === rec.date).length;
        if (!$('#l1').hidden) renderCustDetail();
        orderForm(null, phone);
        $('#of-date').value = rec.date; $('#of-pickup').value = rec.pickup; setUnit(rec.unit);
        toast(`บันทึกไม้ที่ ${n} แล้ว เพิ่มไม้ถัดไปได้เลย`);
      } else renderCustDetail();
      break;
    }
    case 'editp': productForm(product(ui.open)); break;
    case 'savep': {
      const name = $('#pf-name').value.trim(); if (!name) { toast('กรุณาใส่ชื่อสินค้า'); return; }
      const sku = $('#pf-sku').value.trim(), category = $('#pf-cat').value.trim(), id = t.dataset.id;
      let pid = id;
      const before = JSON.stringify(db);
      if (id) { const p = product(id); if (!p) { toast('ไม่พบสินค้านี้แล้ว (อาจถูกลบจากหน้าต่างอื่น)'); closeLayer(2); break; } p.name = name; p.sku = sku; p.category = category; }
      else { const p = { id: uid(), name, sku, category, variants: [] }; pid = p.id; db.products.unshift(p); }
      if (!save()) { revertTo(before); return; } // keep the form open; the photo is neither stored nor removed
      if (!id) { ui.open = pid; ui.src = 'own'; ui.cat = ui.color = ui.size = null; }
      try {
        if (pendingPhoto) await setImage(pid, pendingPhoto);
        else if (pendingPhoto === null) await removeImage(pid);
      } catch { toast('บันทึกรูปไม่สำเร็จ'); }
      closeLayer(2); render(); renderDetail(); break;
    }
    case 'delp': {
      const p = product(t.dataset.id); if (!p) break;
      if (confirm(`ลบ "${p.name}" และสต็อกทั้งหมดของสินค้านี้?`)) {
        const before = JSON.stringify(db); db.products = db.products.filter(x => x !== p);
        if (!save()) { revertTo(before); break; } // not stored: keep the product and its photo
        removeImage(p.id); closeLayer(2); closeLayer(1);
      }
      break;
    }
    case 'pickphoto': $('#pf-file').click(); break;
    case 'rmphoto': pendingPhoto = null; refreshPhotoPreview(); break;
    case 'inc': buzz(); setQty(v, n => n + 1); break;
    case 'dec': buzz(); setQty(v, n => n - 1); break;
    case 'delv': {
      const p = product(ui.open), x = p && p.variants.find(y => y.id === v); if (!x) break;
      if (confirm(`ลบ ${x.color} ไซส์ ${x.size}?`)) { p.variants = p.variants.filter(y => y !== x); save(); renderDetail(); }
      break;
    }
    case 'addv': variantForm(t.dataset.color); break;
    case 'pcolor': vf.qty = $('#vf-qty').value; vf.pickColor = v; renderVariantForm(); break;
    case 'psize': vf.qty = $('#vf-qty').value; vf.pickSizes.has(v) ? vf.pickSizes.delete(v) : vf.pickSizes.add(v); renderVariantForm(); break;
    case 'addcolor': {
      const n = $('#cc-name').value.trim(); if (!n) return;
      const hex = $('#cc-hex').value; vf.qty = $('#vf-qty').value;
      vf.colors.set(n, hex); vf.pickColor = n; renderVariantForm(); break;
    }
    case 'addsize': {
      const n = $('#cs-name').value.trim(); if (!n) return;
      vf.qty = $('#vf-qty').value; vf.sizes.add(n); vf.pickSizes.add(n); renderVariantForm(); break;
    }
    case 'savev': {
      if (!vf.pickColor) { toast('กรุณาเลือกสี'); return; }
      if (!vf.pickSizes.size) { toast('กรุณาเลือกไซส์อย่างน้อย 1 อัน'); return; }
      const qty = Math.max(0, Math.floor(Number($('#vf-qty').value)) || 0);
      const p = product(ui.open), hex = vf.colors.get(vf.pickColor); if (!p) return;
      vf.pickSizes.forEach(size => {
        const ex = p.variants.find(x => x.color === vf.pickColor && x.size === size);
        if (ex) ex.qty += qty; else p.variants.push({ id: uid(), color: vf.pickColor, hex, size, qty });
      });
      save(); closeLayer(2); renderDetail(); break;
    }
    case 'export': {
      const blob = new Blob([JSON.stringify({ kind: 'data', v: 2, ...db })], { type: 'application/json' });
      if (await saveFile(`stock-backup-${today()}.json`, blob)) { db.settings.lastBackup = new Date().toISOString(); save(); toast('สำรองข้อมูลแล้ว (ไม่รวมรูป ใช้ "สำรองรูปสินค้า" แยกต่างหาก)', 4000); }
      else toast('ยกเลิกการสำรองข้อมูล (ยังไม่นับว่าสำรองแล้ว)');
      break;
    }
    case 'exportph': {
      const all = await idbAll(); if (!all.length) { toast('ยังไม่มีรูปสินค้าหรือรูปออเดอร์'); break; }
      toast('กำลังเตรียมไฟล์รูป...', 60000);
      const parts = ['{"kind":"photos","images":{']; let first = true;
      for (const [id, blob] of all) { parts.push((first ? '' : ',') + JSON.stringify(id) + ':' + JSON.stringify(await toDataURL(blob))); first = false; }
      parts.push('}}');
      toast(await saveFile(`stock-photos-${today()}.json`, new Blob(parts, { type: 'application/json' })) ? `สำรองรูป ${all.length} รูปแล้ว` : 'ยกเลิกการสำรองรูป');
      break;
    }
    case 'exportorders': {
      const stamp = localDT(nowIso()).slice(11).replace(':', '');
      if (await saveFile(`stock-customers-queue-${today()}-${stamp}.json`, new Blob([JSON.stringify(buildOrdersFile())], { type: 'application/json' }))) toast(`เตรียมไฟล์แล้ว (${db.orders.length} ออเดอร์) ส่งไปอีกเครื่องแล้วกด "รับข้อมูลลูกค้าและคิว"`, 5000);
      break;
    }
    case 'mergepick': $('#mergeFile').click(); break;
    case 'mergego': {
      if (!mergePending) break;
      const plan = mergePending; mergePending = null;
      if (applyMerge(plan)) { closeLayer(2); render(); toast(`รวมข้อมูลแล้ว: ใหม่ ${plan.add.length} · อัปเดต ${plan.upd.length} · ลบ ${plan.del.length}`, 4000); }
      break;
    }
    case 'badexport': {
      let raw = badRaw; if (raw === null) try { raw = localStorage.getItem(BAD_KEY); } catch {}
      if (raw && await saveFile('stock-unreadable-data.txt', new Blob([raw], { type: 'text/plain' })) && badRaw !== null) {
        badRaw = null; closeLayer(2); toast('ส่งออกข้อมูลเดิมแล้ว ตอนนี้บันทึกข้อมูลได้ตามปกติ (หรือกู้คืนจากไฟล์สำรอง)', 5000);
      }
      break;
    }
    case 'prevrestore': {
      const pv = prevInfo(); if (!pv) break;
      if (!confirm(`กลับไปใช้สำเนาอัตโนมัติเมื่อ ${fmtDT(pv.t)} (${pv.why})?\nข้อมูลปัจจุบันจะถูกแทนที่ รูปสินค้าไม่เปลี่ยน`)) break;
      if (!ensurePrev('ก่อนย้อนกลับสำเนา')) break;
      const cur = db; db = normalizeDb(pv.data).db;
      if (pv.noSnaps) db.snaps = cur.snaps; // the copy was stored without sales snapshots, keep the current ones
      if (!save()) { db = cur; break; }
      ui.src = db.products.some(x => x.pk) ? 'pos' : 'own'; ui.cat = ui.color = ui.size = ui.cust = null; ui.gone = false; closeLayer(2); render(); toast('ย้อนกลับแล้ว');
      loadImgs(false).catch(() => {}); // photos of the restored items are still on the device (see prevOwns)
      break;
    }
    case 'gonezero':
    case 'gonedel': {
      const list = []; db.products.forEach(pp => { if (pp.pk) pp.variants.forEach(x => { if (x.gone) list.push([pp, x]); }); });
      if (!list.length) break;
      if (!confirm(a === 'gonezero' ? `ตั้งจำนวนเป็น 0 สำหรับ ${list.length} รายการที่ไม่พบในไฟล์ POS ล่าสุด?` : `ลบ ${list.length} รายการที่ไม่พบในไฟล์ POS ล่าสุด ถาวร?`)) break;
      if (!ensurePrev(a === 'gonezero' ? 'ก่อนตั้งเป็น 0 (ไม่พบใน POS)' : 'ก่อนลบรายการที่ไม่พบใน POS')) break;
      const before = JSON.stringify(db);
      if (a === 'gonezero') list.forEach(([, x]) => { x.qty = 0; });
      else {
        list.forEach(([pp, x]) => { pp.variants = pp.variants.filter(y => y !== x); });
        db.products = db.products.filter(pp => !pp.pk || pp.variants.length); // photos of removed products stay while the safety copy needs them
      }
      if (!save()) revertTo(before);
      ui.gone = false; render(); break;
    }
    case 'import': $('#importFile').click(); break;
    case 'posimport': $('#posFile').click(); break;
    case 'posgo': {
      if (!posPlan) break;
      const plan = posPlan, sel = document.querySelector('input[name=posmiss]:checked'), mode = sel ? sel.value : 'keep', d = diffPos(plan);
      if (!ensurePrev('ก่อนนำเข้า POS')) break;
      const before = JSON.stringify(db);
      const applied = applyPos(plan, mode), ok = applied && takeSnapshot(plan.fileName);
      if (!applied) revertTo(before); // applied = stock saved; only the snapshot may still have failed
      posPlan = null; closeLayer(2); ui.src = 'pos'; ui.cat = ui.color = ui.size = null; ui.gone = false;
      if (ui.tab !== 'stock') setTab('stock'); else render();
      if (ok) toast(`นำเข้าแล้ว: สินค้าใหม่ ${d.newP} · สี/ไซส์ใหม่ ${d.newV} · อัปเดต ${d.upd}`, 3500);
      break;
    }
    case 'wipe':
      if (confirm('ลบข้อมูลสินค้า ลูกค้า และรูปทั้งหมด?\nระบบเก็บสำเนาข้อมูล (ไม่รวมรูป) ไว้ให้ย้อนกลับได้ แต่รูปสินค้าจะถูกลบถาวร ควรสำรองรูปก่อน')) {
        if (!ensurePrev('ก่อนลบข้อมูลทั้งหมด')) break;
        const cur = db; db = normalizeDb({ settings: db.settings }).db;
        if (!save()) { db = cur; break; } // the data could not be cleared, so the photos must stay too
        closeLayer(2);
        ui.src = 'own'; ui.cat = ui.color = ui.size = ui.cust = null; ui.gone = false;
        imgs.forEach(u => URL.revokeObjectURL(u)); imgs.clear();
        try { await idbRun('readwrite', s => s.clear()); } catch {}
        render();
      }
      break;
  }
});
document.addEventListener('change', async e => {
  if (e.target.dataset.qty) {
    const raw = e.target.value.trim(), n = Number(raw);
    if (raw === '' || isNaN(n)) renderDetail(); // an emptied field must not silently zero the stock: put the old number back
    else setQty(e.target.dataset.qty, () => n);
  }
  if (e.target.id === 'of-free') updatePts();
  if (e.target.id === 'f-from') { ui.from = e.target.value; render(); }
  if (e.target.id === 'f-to') { ui.to = e.target.value; render(); }
  if (e.target.id === 'of-file') {
    const fs = [...e.target.files]; e.target.value = ''; if (!fs.length) return;
    let bad = 0;
    for (const f of fs) {
      try { const blob = await shrink(f); opend.add.push({ k: uid(), blob, url: URL.createObjectURL(blob) }); } catch { bad++; }
    }
    refreshOrderPhotos();
    if (bad) toast('เปิดรูปบางรูปไม่ได้ ลองรูปอื่น');
  }
  if (e.target.id === 'pf-file') {
    const f = e.target.files[0]; if (!f) return;
    try {
      pendingPhoto = await shrink(f);
      if (pendingURL) URL.revokeObjectURL(pendingURL);
      pendingURL = URL.createObjectURL(pendingPhoto); refreshPhotoPreview();
    } catch { toast('เปิดรูปนี้ไม่ได้ ลองรูปอื่น'); }
  }
});
let searchTimer = 0; // redraw once typing pauses, not on every key
$('#search').addEventListener('input', e => { if (ui.tab === 'stock') ui.q = e.target.value; else ui.cq = e.target.value; clearTimeout(searchTimer); searchTimer = setTimeout(render, 120); });
document.addEventListener('input', e => {
  if (e.target.id === 'of-phone') updatePhoneHint();
  if (e.target.id === 'of-t') updatePts();
  if (e.target.id === 'pk-q') { pk.q = e.target.value; pickList(); }
});
$('#posFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    toast('กำลังอ่านไฟล์...');
    await loadXLSX();
    const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
    const plan = planPosImport(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' }));
    if (plan.error) { toast(plan.error); return; }
    plan.fileName = f.name; posPlan = plan; posPreview(f.name);
  } catch { toast('อ่านไฟล์ไม่สำเร็จ ตรวจสอบว่าเป็นไฟล์ Excel/CSV จาก POS'); }
});
$('#mergeFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  let d; try { d = JSON.parse(await f.text()); } catch { toast('ไฟล์ไม่ถูกต้อง'); return; }
  if (!d || d.kind !== 'orders' || !Array.isArray(d.orders)) { toast(d && Array.isArray(d.products) ? 'นี่เป็นไฟล์สำรองข้อมูลทั้งหมด ใช้ปุ่ม "กู้คืนข้อมูล / รูป" แทน' : 'ไม่ใช่ไฟล์ข้อมูลลูกค้าและคิว', 4500); return; }
  mergePreview(d, f.name);
});
$('#importFile').addEventListener('change', async e => {
  const files = [...e.target.files]; e.target.value = ''; if (!files.length) return;
  let dataFile = null; const photoSets = [];
  for (const f of files) {
    let d; try { d = JSON.parse(await f.text()); } catch { toast(`ไฟล์ ${f.name} ไม่ใช่ไฟล์สำรองที่ถูกต้อง`); return; }
    if (d && d.kind === 'orders' && Array.isArray(d.orders) && !Array.isArray(d.products)) { if (files.length > 1) { toast('ไฟล์ข้อมูลลูกค้าและคิวเลือกได้ครั้งละ 1 ไฟล์ และแยกจากไฟล์สำรองข้อมูลทั้งหมด'); return; } mergePreview(d, f.name); return; }
    if (d && Array.isArray(d.products)) { if (dataFile) { toast('เลือกไฟล์ข้อมูลได้ครั้งละ 1 ไฟล์'); return; } dataFile = d; }
    else if (d && d.images && typeof d.images === 'object') photoSets.push(d.images);
    else { toast(`ไฟล์ ${f.name} ไม่ใช่ไฟล์สำรองที่ถูกต้อง`); return; }
  }
  if (dataFile && dataFile.images && typeof dataFile.images === 'object') photoSets.push(dataFile.images); // older backups embedded the photos
  const norm = dataFile ? normalizeDb(dataFile).db : null, nPh = photoSets.reduce((n, o) => n + Object.keys(o).length, 0);
  const msg = norm ? `กู้คืนสินค้า ${norm.products.length} รายการ ออเดอร์ ${norm.orders.length} รายการ${nPh ? ` และรูป ${nPh} รูป` : ''}?\nข้อมูลปัจจุบันจะถูกแทนที่ (ระบบเก็บสำเนาก่อนหน้าไว้ให้ย้อนกลับได้)` : `เพิ่มรูปสินค้า ${nPh} รูป (เฉพาะสินค้าที่มีอยู่ในแอป)?`;
  if (!confirm(msg)) return;
  const blobs = []; // decode every photo first, so a bad file cannot leave the app half restored
  try { for (const set of photoSets) for (const [id, url] of Object.entries(set)) blobs.push([id, await (await fetch(url)).blob()]); }
  catch { toast('อ่านรูปในไฟล์ไม่สำเร็จ ยังไม่มีการเปลี่ยนแปลงข้อมูล', 4000); return; }
  if (norm) {
    if (!ensurePrev('ก่อนกู้คืนจากไฟล์')) return;
    const before = db; db = norm;
    if (!save()) { db = before; return; }
    ui.src = db.products.some(x => x.pk) ? 'pos' : 'own'; ui.cat = ui.color = ui.size = ui.cust = null; ui.gone = false;
  }
  let failed = 0;
  for (const [id, blob] of blobs) if (imgOwned(id)) { try { await setImage(id, blob); } catch { failed++; } }
  if (norm) await loadImgs(false).catch(() => {}); // photos of items not in the file stay on the device, so "undo" can bring them back
  closeLayer(2); render();
  toast(failed ? `กู้คืนแล้ว แต่รูปไม่สำเร็จ ${failed} รูป` : 'กู้คืนข้อมูลแล้ว', 3500);
});

render();
// photos nobody owns are cleaned up, but never when the data looks empty or unreadable (the photos may be all that is left)
loadImgs(!loadNotice && !skipClean && (db.products.length > 0 || db.orders.length > 0)).catch(() => {});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch {}
if (badRaw !== null) toast('อ่านข้อมูลเดิมไม่ได้ และพื้นที่ในเครื่องไม่พอจะเก็บสำเนา กด "⋯" แล้วส่งออกข้อมูลเดิมก่อน จากนั้นจึงบันทึกหรือกู้คืนได้', 12000);
else if (loadNotice) toast('อ่านข้อมูลเดิมไม่ได้ ระบบเก็บสำเนาไว้แล้ว ดูที่เมนู "⋯" เพื่อส่งออกข้อมูลเดิม', 9000);
else if (lsUse().pct >= 75) toast(`พื้นที่เก็บข้อมูลในเครื่องใช้ไปประมาณ ${lsUse().pct}% ใกล้เต็มแล้ว กรุณาสำรองข้อมูลเป็นไฟล์ (ดูรายละเอียดที่เมนู "⋯")`, 8000);
else if (db.products.length || db.orders.length) {
  const lb = db.settings.lastBackup, days = lb ? (Date.now() - new Date(lb)) / 864e5 : Infinity;
  if (days > 7) toast(lb ? `ยังไม่ได้สำรองข้อมูลมา ${Math.floor(days)} วัน` : 'ยังไม่เคยสำรองข้อมูล กด "⋯" แล้วเลือกสำรองข้อมูล', 5000);
}
</script>
</body>
</html>
